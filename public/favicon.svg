<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="solar-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F98A3D"/>
      <stop offset="100%" stop-color="#EA6B1F"/>
    </linearGradient>
    <linearGradient id="solar-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7CC9"/>
      <stop offset="100%" stop-color="#173257"/>
    </linearGradient>
    <linearGradient id="solar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#EA6B1F"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for high contrast visibility on both dark and light browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0F2540"/>

  <!-- Segment 1: Outer Orange Solar Arc -->
  <path d="M48 32 A 18 18 0 0 0 32 14" stroke="url(#solar-orange)" stroke-width="5" stroke-linecap="round"/>

  <!-- Segment 2: Radiant Crest Arc -->
  <path d="M44 44 A 18 18 0 0 0 48 32" stroke="url(#solar-glow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Segment 3: Lower Wave Blue Arc -->
  <path d="M32 50 A 18 18 0 0 0 44 44" stroke="url(#solar-blue)" stroke-width="5" stroke-linecap="round"/>

  <!-- Segment 4: Inner Wave Arc -->
  <path d="M22 32 A 10 10 0 0 1 32 22" stroke="url(#solar-orange)" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 42 A 10 10 0 0 1 22 32" stroke="url(#solar-blue)" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Solar Core Nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="url(#solar-glow)"/>
</svg>
